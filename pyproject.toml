[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "manjim"
dynamic = ["version"]
description = "Zero-dependency GRC / IT audit CLI: ISO 27001 & SOC 2 audit mapping, DPDP risk register, seal/verify."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Krupakar S Bilichod" }]
keywords = ["grc", "audit", "iso27001", "soc2", "dpdp", "risk", "compliance", "cli"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/manjim-dev/manjim"
Issues = "https://github.com/manjim-dev/manjim/issues"

[project.scripts]
manjim = "manjim.cli:main"

[tool.hatch.version]
path = "src/manjim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/manjim"]
