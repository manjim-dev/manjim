# Dogfood: manjim audits its own repo and uploads findings to the Security tab.
name: manjim-audit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: manjim audit . --format sarif --out manjim.sarif --fail-under 90
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: manjim.sarif
          category: manjim
